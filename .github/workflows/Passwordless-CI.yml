name: Passwordless-CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'passwordless/**'
      - '.github/workflows/Passwordless-CI.yml'
  pull_request:
    paths:
      - 'passwordless/**'
      - '.github/workflows/Passwordless-CI.yml'

jobs:
  zta-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: passwordless/zta-gateway

  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JSON policies
        run: node passwordless/tools/validate.mjs
      - name: Parse PowerShell scripts
        shell: pwsh
        run: ./passwordless/tools/Test-ScriptSyntax.ps1
